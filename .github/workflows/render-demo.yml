name: Render bilingual science demo

on:
  workflow_dispatch:
    inputs:
      quality:
        description: "Preview (360x640) or final (1080x1920)"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - full
  # Build both languages whenever the workflow itself changes.
  # Subsequent runs are manual, except for deliberate workflow edits.
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-demo.yml
      - science_factory/render_scenes.py
      - 'science_factory/visuals/**'
      - 'science_factory/assets/**'

permissions:
  contents: read

concurrency:
  group: render-science-demo
  cancel-in-progress: true

jobs:
  render:
    name: Render ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - language: en-US
            storyboard: examples/moon_orbit.json
          - language: zh-CN
            storyboard: examples/moon_orbit.zh-CN.json
    env:
      PIP_NO_CACHE_DIR: "1"
      HF_HOME: /tmp/science-hf
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      STORYBOARD: ${{ matrix.storyboard }}
      LOCALE: ${{ matrix.language }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install native graphics, audio and font dependencies
        timeout-minutes: 5
        run: |
          # Runner images already have APT indexes. Avoid an unbounded refresh:
          # Ubuntu 24.04 Azure mirrors can stall during apt-get update.
          export DEBIAN_FRONTEND=noninteractive
          timeout -k 10s 240s sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            build-essential pkg-config libcairo2-dev libpango1.0-dev \
            ffmpeg espeak-ng fonts-dejavu-core fonts-noto-cjk

      - name: Install CPU-only PyTorch and science factory
        timeout-minutes: 25
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[all]'
          python -m manim --version

      - name: Verify storyboard and run tests
        run: |
          python -m unittest discover -s tests -v
          python -m science_factory validate examples/moon_orbit.json
          python -m science_factory validate examples/moon_orbit.zh-CN.json
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ('earth', 'moon'):
              path = Path(f'science_factory/assets/{name}_disc.png')
              with Image.open(path) as body:
                  assert body.mode == 'RGBA' and body.size == (512, 512)
          PY

      - name: Render sample video with real local narration
        timeout-minutes: 20
        env:
          REQUESTED_QUALITY: ${{ inputs.quality || 'preview' }}
        run: |
          python -m science_factory build "$STORYBOARD" \
            --voice kokoro --quality "$REQUESTED_QUALITY" --output output

      - name: Confirm deliverable is ready and print video metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifests = list(Path('output').glob('*/manifest.json'))
          assert len(manifests) == 1, 'expected one completed job'
          data = json.loads(manifests[0].read_text(encoding='utf-8'))
          assert data['status'] == 'READY', 'only Kokoro-narrated output can pass'
          import os
          assert data['language'] == os.environ['LOCALE'], 'wrong language in render'
          assert len(data['review_frames']) == 6, 'missing scene review images'
          print(json.dumps(data['checks'], indent=2))
          PY

      - name: Upload video and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-moon-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 1
          if-no-files-found: warn
          path: |
            output/**/final.mp4
            output/**/manifest.json
            output/**/storyboard.json
            output/**/render-plan.json
            output/**/captions.srt
            output/**/scene_*_review.jpg
