name: Render bilingual science demo

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Render one topic, or both for a cross-topic QA batch"
        required: true
        default: moon_orbit
        type: choice
        options:
          - moon_orbit
          - sound_vacuum
          - all
      quality:
        description: "Preview (360x640) or final (1080x1920)"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - full
  # Renderer changes get a fast Moon preview; [full-render] checks both
  # scientific topics in both languages at 1080x1920.
  push:
    branches:
      - main
    paths:
      - .github/workflows/render-demo.yml
      - 'science_factory/**'
      - 'examples/**'
      - 'tests/**'
      - pyproject.toml
      - 'science_factory/visuals/**'
      - 'science_factory/assets/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: render-science-demo-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  render:
    name: Render ${{ matrix.topic }} ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        language: [en-US, zh-CN]
        topic: ${{ fromJSON((github.event_name == 'push' && contains(github.event.head_commit.message, '[full-render]') && '["moon_orbit","sound_vacuum"]') || (github.event_name == 'push' && '["moon_orbit"]') || (inputs.topic == 'all' && '["moon_orbit","sound_vacuum"]') || format('["{0}"]', inputs.topic)) }}
    env:
      HF_HOME: /tmp/science-hf
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
      TOPIC: ${{ matrix.topic }}
      LOCALE: ${{ matrix.language }}
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore local Kokoro model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/science-hf
          key: kokoro-models-${{ runner.os }}-py312-v1

      - name: Install native graphics, audio and font dependencies
        timeout-minutes: 5
        run: |
          # Runner images already have APT indexes. Avoid an unbounded refresh:
          # Ubuntu 24.04 Azure mirrors can stall during apt-get update.
          export DEBIAN_FRONTEND=noninteractive
          timeout -k 10s 240s sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            build-essential pkg-config libcairo2-dev libpango1.0-dev \
            ffmpeg espeak-ng fonts-dejavu-core fonts-noto-cjk

      - name: Install CPU-only PyTorch and science factory
        timeout-minutes: 25
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[all]'
          python -m manim --version

      - name: Verify storyboard and run tests
        run: |
          python -m unittest discover -s tests -v
          python -m science_factory validate examples/moon_orbit.json
          python -m science_factory validate examples/moon_orbit.zh-CN.json
          python -m science_factory validate examples/sound_vacuum.json
          python -m science_factory validate examples/sound_vacuum.zh-CN.json
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name in ('earth', 'moon'):
              path = Path(f'science_factory/assets/{name}_disc.png')
              with Image.open(path) as body:
                  assert body.mode == 'RGBA' and body.size == (512, 512)
          PY

      - name: Restore checkpoint from a previous attempt
        if: ${{ github.run_attempt > 1 }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: science-${{ matrix.topic }}-${{ matrix.language }}-${{ github.run_id }}-*
          path: output
          merge-multiple: true

      - name: Render sample video with real local narration
        timeout-minutes: 35
        env:
          REQUESTED_QUALITY: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-render]') && 'full') || inputs.quality || 'preview' }}
        run: |
          if [ "$LOCALE" = 'zh-CN' ]; then
            STORYBOARD="examples/${TOPIC}.zh-CN.json"
          else
            STORYBOARD="examples/${TOPIC}.json"
          fi
          python -m science_factory build "$STORYBOARD" --voice kokoro --quality "$REQUESTED_QUALITY" --output output --job-id "gha-${GITHUB_RUN_ID}-${TOPIC}-${LOCALE}"

      - name: Confirm deliverable is ready and print video metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifests = list(Path('output').glob('*/manifest.json'))
          assert len(manifests) == 1, 'expected one completed job'
          data = json.loads(manifests[0].read_text(encoding='utf-8'))
          assert data['status'] == 'TECHNICALLY_READY', 'technical QA must pass; editorial review remains separate'
          import os
          assert data['language'] == os.environ['LOCALE'], 'wrong language in render'
          assert len(data['review_frames']) == 18, 'missing opening/midpoint/closing scene review images'
          assert data['checks']['audio_codec'] == 'aac'
          assert data['checks']['max_black_seconds'] == 0
          assert data['checks']['max_silence_seconds'] <= 2.6
          assert data['checks']['true_peak_dbfs'] <= -1.0
          assert -18.0 <= data['checks']['integrated_loudness_lufs'] <= -14.0
          assert data['quality_report']['status'] == 'CONTENT_REVIEW_REQUIRED'
          print(json.dumps(data['checks'], indent=2))
          PY

      - name: Upload video and QA evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: science-${{ matrix.topic }}-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          compression-level: 1
          if-no-files-found: warn
          path: |
            output/**/final.mp4
            output/**/manifest.json
            output/**/job-state.json
            output/**/storyboard.json
            output/**/render-plan.json
            output/**/captions.srt
            output/**/scene_*_review.jpg
