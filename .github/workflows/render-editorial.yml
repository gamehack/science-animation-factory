name: Render editorial video preview

on:
  pull_request:
    paths:
      - .github/workflows/render-editorial.yml
      - 'science_factory/editorial_*.py'
      - examples/eas_kodak_1888.json
      - scripts/prepare_eas_demo_assets.py
  workflow_dispatch:
    inputs:
      quality:
        type: choice
        description: "Preview for first inspection; mobile/full after QA"
        required: true
        default: preview
        options: [preview, mobile, full]

permissions:
  contents: read

concurrency:
  group: editorial-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      HF_HOME: /tmp/science-hf
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: /tmp/science-hf
          key: kokoro-models-${{ runner.os }}-py312-v1
      - name: Install video and TTS dependencies
        timeout-minutes: 25
        run: |
          export DEBIAN_FRONTEND=noninteractive
          timeout -k 10s 240s sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=2 -o Acquire::http::Timeout=30 \
            ffmpeg espeak-ng fonts-dejavu-core fonts-noto-cjk \
            build-essential pkg-config libcairo2-dev libpango1.0-dev
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[all]'
          python -m pip install 'Pillow>=10,<13'
      - name: Validate all storyboards and run tests
        run: |
          python -m unittest discover -s tests -v
          science-factory validate examples/moon_orbit.json
          science-factory validate-editorial examples/eas_kodak_1888.json
          python scripts/prepare_eas_demo_assets.py
      - name: Generate technically checked Kodak editorial preview
        timeout-minutes: 25
        run: |
          science-factory build-editorial examples/eas_kodak_1888.json \
            --assets-dir examples/assets/eas \
            --voice kokoro \
            --quality '${{ inputs.quality || 'preview' }}' \
            --job-id 'editorial-${{ github.run_id }}-${{ inputs.quality }}'
          python - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path('output').glob('*/manifest.json'))
          assert len(paths)==1
          result=json.loads(paths[0].read_text())
          assert result['status']=='TECHNICALLY_READY',result
          assert result['content_review']=='REQUIRED'
          assert result['can_publish'] is False
          assert result['inspection']['video_codec']=='h264'
          assert result['inspection']['audio_codec']=='aac'
          print(json.dumps(result['inspection'],indent=2))
          PY
      - name: Upload video and audit artifacts (manual review only)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: eas-kodak-${{ inputs.quality || 'preview' }}-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: warn
          compression-level: 1
          path: |
            output/**/final.mp4
            output/**/manifest.json
            output/**/qa.json
            output/**/captions.srt
            output/**/job-state.json
